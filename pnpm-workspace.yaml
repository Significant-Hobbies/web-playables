packages:
  - "packages/*"
  - "games/*"
  - "apps/*"
  # Networked games: not YouTube Playables targets (see AGENTS.md).
  - "networked-games/*"
  - "networked-games/open-historia/landing-astro"

onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd

ignoredBuiltDependencies:
  - core-js
  - protobufjs
  - unrs-resolver

allowBuilds:
  core-js: false
  esbuild: true
  protobufjs: false
  sharp: true
  unrs-resolver: false
  workerd: true
