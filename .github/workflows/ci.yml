name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/war-chest-godot-4.7.2
            ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-web-4.7.2-${{ runner.os }}
      - run: pnpm war-chest:setup
      - run: pnpm war-chest:check
      - run: pnpm run check
      - run: pnpm --filter open-historia exec playwright install --with-deps chromium
      - run: pnpm games:e2e
      - name: Retain built games for rendered review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-playables-preview
          retention-days: 3
          path: apps/hub/dist
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-playables-browser-evidence
          retention-days: 3
          path: |
            /tmp/ember-road-web-evidence
            /tmp/playables-cloud-evidence
      - name: Run Idle Startup test suite
        working-directory: games/idle-startup
        run: pnpm test
      - name: Verify search discovery output
        run: |
          grep -Fq 'https://idle.aliveville.com/sitemap.xml' apps/hub/dist/robots.txt
          grep -Fq 'https://idle.aliveville.com/play/idle-startup/' apps/hub/dist/sitemap.xml
          grep -Fq 'rel="canonical" href="https://idle.aliveville.com/"' apps/hub/dist/index.html
          grep -Fq 'rel="canonical" href="https://idle.aliveville.com/play/idle-startup/"' apps/hub/dist/play/idle-startup/index.html

  # Open Historia: networked AI game, deliberately outside the YouTube
  # Playables-certified lane above. Mirrors its former standalone CI.
  historia:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: networked-games/open-historia
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm exec playwright test e2e/campaign.spec.ts e2e/campaign-layout.spec.ts --project=desktop --project=mobile
      - run: pnpm cf:build
      - name: Retain Historia runtime and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historia-preview
          retention-days: 3
          path: |
            networked-games/open-historia/dist
            networked-games/open-historia/test-results
