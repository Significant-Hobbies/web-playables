name: Deploy Open Historia Worker

# Open Historia (networked-games/open-historia) deploys as its own Cloudflare
# Worker `open-historia` at historia.aliveville.com. It is separate from the
# Web Playables Pages site and from the YouTube Playables-certified games.
# Manual dispatch only. Code rollback preserves D1 data but old cloud writes
# remain fenced after migration0002. Roll forward with the compatible uploaded
# version if promotion fails; do not remove the database fences.
on:
  workflow_dispatch:
    inputs:
      stage_only:
        description: Upload a Worker version without database migrations or live promotion
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: networked-games/open-historia
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm cf:build
      - name: Validate GitHub deploy secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing GitHub secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      # Upload first: an upload failure must leave the live schema/writer untouched.
      - name: Upload Worker version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          pnpm exec wrangler versions upload --tag "$GITHUB_SHA" --message "GitHub Actions $GITHUB_RUN_ID" | tee upload.log
          version_id=$(grep -oE 'Worker Version ID: [0-9a-f-]{36}' upload.log | awk '{print $4}')
          test -n "$version_id" || { echo "::error::Could not read Worker Version ID from wrangler output"; exit 1; }
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
      - name: Record recovery bookmark and apply reviewed D1 migrations
        if: ${{ !inputs.stage_only }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler d1 time-travel info open-historia --json
          pnpm exec wrangler d1 migrations list open-historia --remote
          pnpm exec wrangler d1 migrations apply open-historia --remote
      # Migration fences old unconditional cloud writers. If promotion fails,
      # roll forward with this uploaded version; do not drop the fences or claim
      # that deploying an older Worker restores its cloud-write capability.
      - name: Promote uploaded Worker version
        if: ${{ !inputs.stage_only }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
        run: |
          if ! pnpm exec wrangler versions deploy "$VERSION_ID@100%" --message "GitHub Actions $GITHUB_RUN_ID" --yes; then
            echo "::error::Promotion failed after migration. Preserve the database and retry promotion of uploaded version $VERSION_ID; old Worker cloud writes are intentionally fenced."
            exit 1
          fi
      - name: Report staged-only version
        if: ${{ inputs.stage_only }}
        env:
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
        run: |
          echo "::notice::Worker version $VERSION_ID is staged only, NOT live. Database migrations, promotion and production smoke checks were skipped."
          echo "Staged Worker version: $VERSION_ID (not live; no database migration or promotion performed)." >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke check production worker
        if: ${{ !inputs.stage_only }}
        run: curl --fail --silent --show-error --location --max-time 30 https://historia.aliveville.com >/dev/null
