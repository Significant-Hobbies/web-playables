name: Deploy Open Historia Worker

# Open Historia (networked-games/open-historia) deploys as its own Cloudflare
# Worker `open-historia` at historia.aliveville.com. It is separate from the
# Web Playables Pages site and from the YouTube Playables-certified games.
# Manual dispatch only. Rollback: `wrangler versions deploy <previous-id>@100%`.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: networked-games/open-historia
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm cf:build
      - name: Validate GitHub deploy secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing GitHub secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      # `wrangler deploy` also re-syncs triggers, which needs zone-level
      # "Workers Routes: Read". The account-scoped Fleet token can't, so CI
      # uploads a version and promotes it. The custom domain is already attached.
      - name: Upload and promote Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          pnpm exec wrangler versions upload --tag "$GITHUB_SHA" --message "GitHub Actions $GITHUB_RUN_ID" | tee upload.log
          version_id=$(grep -oE 'Worker Version ID: [0-9a-f-]{36}' upload.log | awk '{print $4}')
          test -n "$version_id" || { echo "::error::Could not read Worker Version ID from wrangler output"; exit 1; }
          pnpm exec wrangler versions deploy "$version_id@100%" --message "GitHub Actions $GITHUB_RUN_ID" --yes
      - name: Smoke check production worker
        run: curl --fail --silent --show-error --location --max-time 30 https://historia.aliveville.com >/dev/null
